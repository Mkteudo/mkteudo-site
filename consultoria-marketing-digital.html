<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Mkteúdo</title><link rel="canonical" href="https://www.mkteudo.com.br/consultoria-de-marketing"><meta http-equiv="refresh" content="0;url=https://www.mkteudo.com.br/consultoria-de-marketing"><meta name="robots" content="noindex,follow"><script>location.replace("https://www.mkteudo.com.br/consultoria-de-marketing")</script><style id="mkt-tabelas-v1">
/* Tabelas no celular.
   Dois defeitos somados deixavam a tabela ilegivel:
   1) o bloco mkt-overflow-v1 punha display:block + width:100% na tabela, o que
      faz as colunas ESPREMEREM em vez de rolar — overflow-x nunca dispara;
   2) o overflow-wrap:anywhere aplicado a .content era herdado pelas celulas e
      quebrava palavra no meio ("Telemark / eting").
   A correcao: a tabela volta a ser tabela, com largura minima, e quem rola e o
   involucro .tbl-wrap. As celulas quebram por palavra, nunca no meio dela. */
/* o item de grid precisa de min-width:0, senao ele estica para caber a tabela
   em vez de deixar o involucro rolar (blowout classico de grid/flex) */
.layout,.content,.side{min-width:0}
.content>*{max-width:100%}
.tbl-wrap{
  max-width:100%;width:100%;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:1.6rem 0;border-radius:12px;border:1px solid var(--bor,#ebebeb);
  background:
    linear-gradient(to right,var(--sur,#fff) 30%,rgba(255,255,255,0)),
    linear-gradient(to right,rgba(255,255,255,0),var(--sur,#fff) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,rgba(13,0,16,.14),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,rgba(13,0,16,.14),rgba(0,0,0,0)) 100% 0;
  background-repeat:no-repeat;background-size:36px 100%,36px 100%,14px 100%,14px 100%;
  background-attachment:local,local,scroll,scroll;
}
.content .tbl-wrap table,.tbl-wrap table{
  display:table!important;width:100%;min-width:620px;max-width:none;
  margin:0;overflow:visible;border-collapse:collapse;table-layout:auto;
}
.content .tbl-wrap th,.content .tbl-wrap td,.tbl-wrap th,.tbl-wrap td{
  overflow-wrap:break-word;word-break:normal;hyphens:none;vertical-align:top;
}
.content .tbl-wrap th,.tbl-wrap th{white-space:nowrap}
@media (max-width:640px){
  .content .tbl-wrap table,.tbl-wrap table{min-width:560px;font-size:.85rem}
  .content .tbl-wrap th,.content .tbl-wrap td,.tbl-wrap th,.tbl-wrap td{
    padding:.6rem .8rem;overflow-wrap:break-word!important;word-break:normal!important;
  }
  .tbl-wrap::after{content:'';display:block}
}
.tbl-aviso{
  display:none;font-size:.78rem;color:var(--mut,#6B6B6B);margin:-1.1rem 0 1.6rem;
}
@media (max-width:640px){.tbl-aviso{display:block}}
</style>
</head><body><p>Esta página mudou de endereço. <a href="https://www.mkteudo.com.br/consultoria-de-marketing">Ir para a versão atual</a></p></body>
</html>
